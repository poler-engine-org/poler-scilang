[package]
name = "poler-scilang"
version = "1.0.0"
edition = "2021"
authors = ["Vitalij", "POLER Scientific Computing Group"]
description = "Universal Scientific Scripting Language for the Calculator of Everything (AVX2 ASM + Zig SIMD + Rust)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"
